name: Steward-gated verified receipt settlement
on:
  workflow_dispatch:
    inputs:
      tx_hash:
        description: Existing successful Base PayrollPaid transaction hash (no transfer is made)
        required: true
      contributor_github:
        description: Optional exact registered contributor
        required: false
      issue_ref:
        description: Optional owner/repo#issue
        required: false
      role:
        description: Optional contributor, implementer, idea-originator or tester
        required: false
      currency:
        description: Optional configured ERC20 symbol
        required: false
permissions:
  contents: read
concurrency:
  group: payroll-ledger
  cancel-in-progress: false
jobs:
  verify-receipt:
    if: vars.PAYROLL_SETTLEMENT_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    environment: payroll-steward
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.repository.default_branch }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts
      - run: node payroll/scripts/validatePayrollQueue.js
      - run: node payroll/scripts/settlePayroll.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYROLL_ACTIVATE: ${{ vars.PAYROLL_SETTLEMENT_ENABLED }}
          INPUT_TX_HASH: ${{ inputs.tx_hash }}
          INPUT_CONTRIBUTOR_GITHUB: ${{ inputs.contributor_github }}
          INPUT_ISSUE_REF: ${{ inputs.issue_ref }}
          INPUT_ROLE: ${{ inputs.role }}
          INPUT_CURRENCY: ${{ inputs.currency }}
      - run: node payroll/scripts/validatePayrollQueue.js
      - name: Persist only verified ledger settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payroll/payroll-queue.json payroll/contributor-accounts.json
          if ! git diff --cached --quiet; then
            git commit -m "Record steward-verified Base receipt settlement" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
