name: Steward-gated merged bounty queue
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Already-merged PR number
        required: true
      issue_number:
        description: Maintainer-reviewed issue numbers (comma separated)
        required: false
permissions:
  contents: read
concurrency:
  group: payroll-ledger
  cancel-in-progress: false
jobs:
  queue:
    if: vars.PAYROLL_QUEUE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    environment: payroll-steward
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      # Always execute reviewed default-branch code, never the triggering PR's checkout.
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.repository.default_branch }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node payroll/scripts/validatePayrollQueue.js
      - run: node payroll/scripts/processMergedBounty.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYROLL_ACTIVATE: ${{ vars.PAYROLL_QUEUE_ENABLED }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
      - run: node payroll/scripts/validatePayrollQueue.js
      - name: Persist only queue and reviewed ledger accrual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payroll/payroll-queue.json payroll/contributor-accounts.json
          if ! git diff --cached --quiet; then
            git commit -m "Record reviewed merged bounty queue" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
